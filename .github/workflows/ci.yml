name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  id-token: write

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install LLVM tools
        run: rustup component add llvm-tools-preview

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Check
        run: cargo check --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --no-fail-fast

      - name: Blocking backend validation
        run: |
          cargo test -p iox2-log-archive-core \
            --test log_archive_hardening_and_performance_tests \
            log_archive_blocking_backend_sustained_ingest_preserves_replay_integrity \
            -- --exact

      - name: Blocking backend benchmark smoke
        run: |
          RECORDS=1000 \
          PAYLOAD_BYTES=1024 \
          SEGMENT_BYTES=1048576 \
          BACKEND=blocking \
          PROFILE=throughput \
          CLEANUP_ARCHIVE=true \
          crates/core/scripts/run_throughput_profile_benchmark.sh \
            target/benchmarks/ci-blocking-backend-smoke

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage
        run: ./scripts/coverage.sh

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: target/llvm-cov/lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: target/llvm-cov/lcov.info
          fail_ci_if_error: true
          use_oidc: true

  portable-core:
    name: Portable Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check portable crates
        run: |
          cargo check -p iox2-log-archive-core --lib --examples
          cargo check -p iox2-log-archive-sqlite --lib

      - name: Test portable crates
        run: |
          cargo test -p iox2-log-archive-core --lib
          cargo test -p iox2-log-archive-sqlite --lib
